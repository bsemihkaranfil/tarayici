<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b3d91">
<title>Tarayıcı</title>
<link rel="icon" href="icon.png">
<style>
:root{
  --bg:#000; --fg:#f2f2f2; --dim:#9aa3ad;
  --hd:#0b3d91; --sk:#161616; --acc:#1e6ff0; --lnk:#8fc1ff;
  --hh:20px; --skh:18px; --m:4px;
}
html{font-size:13px}
html.big{font-size:15px}
@media (min-width:200px){
  :root{--hh:36px; --skh:28px; --m:8px}
  html{font-size:19px}
  html.big{font-size:22px}
}
*{box-sizing:border-box; margin:0; padding:0}
[hidden]{display:none !important}
html,body{height:100%; background:var(--bg); color:var(--fg); overflow:hidden}
body{position:relative; display:flex; flex-direction:column;
  font-family:Roboto,"Roboto Condensed",Arial,sans-serif; line-height:1.25}
@media (min-width:400px){
  body{max-width:320px; margin:0 auto; border-left:1px solid #333; border-right:1px solid #333}
}

/* Başlık */
header{flex:0 0 var(--hh); height:var(--hh); background:var(--hd); color:#fff;
  font-weight:700; display:flex; align-items:center; padding:0 var(--m)}
#hw{flex:1; overflow:hidden; white-space:nowrap}
#ht{display:inline-block; white-space:nowrap}
header.mq #ht{animation:mq 8s linear infinite}
header.msg{background:#1e7a45}
@keyframes mq{0%,18%{transform:translateX(0)} 82%,100%{transform:translateX(var(--mq,-50%))}}

/* İçerik */
main{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:2px 0 4px}
form{padding:3px var(--m) 3px}
#q{display:block; width:100%; height:1.7em; font:inherit; color:var(--fg);
  background:#1a1a1a; border:1px solid #555; border-radius:3px; padding:0 .3em; outline:none}
#q::placeholder{color:#8a8a8a}
#q:focus{background:#fff; color:#000; border:2px solid var(--acc)}
form.add #q{border-color:#2ecc71}
form.add #q:focus{border:2px solid #2ecc71}

.row{display:flex; align-items:center; gap:.35em; width:100%; min-height:1.55em;
  padding:2px var(--m); border:0; border-radius:0; background:none; color:inherit;
  font:inherit; text-align:left; text-decoration:none; outline:none; cursor:pointer}
.row:focus{background:var(--acc); color:#fff}
.b{flex:0 0 auto; width:1.6em; height:1.6em; line-height:1.6em; font-size:.8em;
  font-weight:700; text-align:center; color:#fff; border-radius:3px; background:#444}
.t{flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.act .b{background:none; border:1px solid #666; color:#ccc}
.row.act:focus .b{border-color:#fff; color:#fff}
.go .b{background:#2ecc71; color:#000}
#go2 .b{background:#8fc1ff}
.mi{flex:0 0 auto; font-size:.66em; color:var(--dim); border:1px solid #444; border-radius:2px; padding:0 .25em; line-height:1.4}
.row:focus .mi{color:#fff; border-color:#cfe0ff}
.sep{height:1px; background:#2a2a2a; margin:2px var(--m)}
.radio{flex:0 0 auto; width:.8em; height:.8em; border:2px solid currentColor; border-radius:50%}
.radio.on{background:currentColor}
.txt{padding:2px var(--m); outline:none; font-size:.9em}
.txt:focus{background:#1a2a44}
.txt b{color:#fff}
.empty,.note{padding:.5em var(--m); color:var(--dim)}

/* Okuyucu */
.rd,.rh{padding:1px var(--m) 3px; outline:none; overflow-wrap:anywhere; line-height:1.3}
.rh{font-weight:700; padding-top:4px}
.rh.l1{font-size:1.14em}
.rh.l2{font-size:1.06em}
.rd:focus,.rh:focus{background:#14233b; box-shadow:inset 2px 0 0 var(--acc)}
.rd .a,.rh .a{color:var(--lnk); text-decoration:underline}
.rd.li{position:relative; padding-left:calc(var(--m) + .75em)}
.rd.li::before{content:"\2022"; position:absolute; left:calc(var(--m) + .1em); color:var(--dim)}
.rd.q{margin-left:var(--m); padding-left:.4em; border-left:2px solid #555; color:#cfd6de}
.rd.code{font-family:monospace; font-size:.82em; white-space:pre-wrap; color:#cfe8d8}
.rd.tr{font-size:.9em; color:#dde3ea}
.lk{color:var(--lnk)}
.lk .t{white-space:normal; overflow:visible}
.lk.hb{font-weight:700}
.lk:focus{color:#fff}
.res{align-items:flex-start}
.res .t{white-space:normal}
.res .rt{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-weight:700}
.res .rs{display:block; font-size:.76em; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.res:focus .rs{color:#dfe8ff}

/* Menü, yükleniyor */
#menu,#ov{position:absolute; left:0; right:0; top:var(--hh); bottom:var(--skh); z-index:5}
#menu{background:#0f0f0f; overflow-y:auto; padding:2px 0}
#menu .t{white-space:normal}
#ov{background:rgba(0,0,0,.92); display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:var(--m)}
#ov .l{font-weight:700}
#ovh{margin-top:.3em; color:var(--dim); font-size:.85em; word-break:break-all}

/* Yazılım tuşları */
footer{flex:0 0 var(--skh); height:var(--skh); background:var(--sk); color:#ddd;
  display:flex; align-items:center; padding:0 var(--m); font-size:.85rem; font-weight:700}
footer span{flex:1; white-space:nowrap; overflow:hidden; cursor:pointer}
#skc{text-align:center}
#skr{text-align:right}
</style>
</head>
<body>
<header id="hd"><div id="hw"><span id="ht">Tarayıcı</span></div></header>
<main id="mn">
  <form id="fm" autocomplete="off" novalidate>
    <input id="q" type="text" placeholder="Adres veya arama" aria-label="Adres veya arama"
      autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
      data-c="Yaz">
  </form>
  <button id="go" class="row go" type="button" hidden><span class="b">&#8594;</span><span class="t"></span></button>
  <button id="go2" class="row go" type="button" hidden><span class="b">&#187;</span><span class="t"></span></button>
  <div id="ls"></div>
</main>
<div id="menu" hidden></div>
<div id="ov" hidden><div class="l">Açılıyor…</div><div id="ovh"></div></div>
<footer><span id="skl">Menü</span><span id="skc">Yaz</span><span id="skr">Çık</span></footer>

<script>
(function () {
  'use strict';

  /* ---------- Ayarlar ---------- */
  var VERSION = '2.3';
  var ENG = {
    yandex: { n: 'Yandex', q: 'https://yandex.com.tr/search/touch/?text=' },
    google: { n: 'Google', q: 'https://www.google.com/search?q=' },
    ddg:    { n: 'DuckDuckGo', q: 'https://lite.duckduckgo.com/lite/?q=' },
    bing:   { n: 'Bing', q: 'https://www.bing.com/search?q=' },
    wiki:   { n: 'Vikipedi', q: 'https://tr.m.wikipedia.org/w/index.php?search=' }
  };
  var ENG_KEYS = ['yandex', 'google', 'ddg', 'bing', 'wiki'];
  // Okuyucu: sayfayı sade metne çeviren servis. Uygulama içi arama DDG Lite sonuçlarını bu servisten okur.
  var READER = 'https://r.jina.ai/';
  function ddgUrl(q) { return 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(q) + '&kl=tr-tr'; }
  var DEF = [
    { n: 'Yandex',    u: 'https://yandex.com.tr/' },
    { n: 'Google',    u: 'https://www.google.com/' },
    { n: 'Claude',    u: 'https://claude.ai/' },
    { n: 'ChatGPT',   u: 'https://chatgpt.com/' },
    { n: 'Vikipedi',  u: 'https://tr.m.wikipedia.org/', r: 1 },
    { n: 'YouTube',   u: 'https://m.youtube.com/' },
    { n: 'Instagram', u: 'https://www.instagram.com/' },
    { n: 'GS Sözlük', u: 'https://rerererarara.net/', r: 1 }
  ];
  var TITLES = { home: 'Tarayıcı', hist: 'Geçmiş', eng: 'Arama motoru', help: 'Yardım',
                 read: 'Okuyucu', srch: 'Arama', saved: 'Okuma listesi' };
  var PAL = ['#c0392b', '#d35400', '#9a7d0a', '#1e8449', '#117a65', '#2471a3',
             '#7d3c98', '#a93226', '#1f618d', '#6e2c00'];
  var HIST_MAX = 40, SAVED_MAX = 60, MAX_BLOCKS = 1500, MAX_CHARS = 150000;
  var SVG = function (d) {
    return '<svg viewBox="0 0 16 16" width="1em" height="1em" fill="none" stroke="currentColor" ' +
      'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.12em">' + d + '</svg>';
  };
  var CLOCK = SVG('<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.4 1.6"/>');
  var BOOK = SVG('<path d="M3.5 2.5h7.5a1.5 1.5 0 0 1 1.5 1.5v9.5H5A1.5 1.5 0 0 1 3.5 12z"/><path d="M3.5 12A1.5 1.5 0 0 1 5 10.5h7.5"/>');
  var OPEN = SVG('<path d="M9 3h4v4"/><path d="M13 3L7.5 8.5"/><path d="M11 9.5V13H3V5h3.5"/>');
  var RETRY = SVG('<path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v3h-3"/>');

  var $ = function (id) { return document.getElementById(id); };
  var hd = $('hd'), hw = $('hw'), ht = $('ht'), mn = $('mn'), fm = $('fm'), q = $('q'),
      goB = $('go'), goB2 = $('go2'), ls = $('ls'), menu = $('menu'), ov = $('ov'), ovh = $('ovh'),
      skl = $('skl'), skc = $('skc'), skr = $('skr');

  /* ---------- Kayıt (localStorage yoksa bellekte çalışır) ---------- */
  function load(k, d) {
    try { var v = localStorage.getItem('tb.' + k); if (v) return JSON.parse(v); } catch (e) {}
    return d;
  }
  function save(k, v) { try { localStorage.setItem('tb.' + k, JSON.stringify(v)); } catch (e) {} }
  function sload(k, d) {
    try { var v = sessionStorage.getItem('tb.' + k); if (v) { var x = JSON.parse(v); if (x && typeof x === 'object') return x; } } catch (e) {}
    return d;
  }
  function ssave(k, v) {
    try { sessionStorage.setItem('tb.' + k, JSON.stringify(v)); return true; } catch (e) { return false; }
  }
  function okItem(x) {
    return !!x && typeof x.n === 'string' && typeof x.u === 'string' && /^https?:\/\//i.test(x.u);
  }
  var DEFR = {};
  DEF.forEach(function (d) { DEFR[d.u] = d.r ? 1 : 0; });
  function copyDef() { return DEF.map(function (s) { return { n: s.n, u: s.u, r: s.r ? 1 : 0 }; }); }

  var sites = load('sites', null);
  sites = Array.isArray(sites) ? sites.filter(okItem).map(function (s) {
    return { n: s.n, u: s.u, r: s.r === undefined ? (DEFR[s.u] || 0) : (s.r ? 1 : 0) };
  }) : copyDef();
  var hist = load('hist', []);
  hist = Array.isArray(hist) ? hist.filter(okItem).slice(0, HIST_MAX) : [];
  var saved = load('saved', []);
  saved = Array.isArray(saved) ? saved.filter(okItem).slice(0, SAVED_MAX) : [];
  var prefs = load('prefs', {});
  if (!prefs || typeof prefs !== 'object') prefs = {};
  if (!ENG[prefs.eng]) prefs.eng = 'yandex';
  prefs.big = !!prefs.big;
  if (prefs.sr !== 'site') prefs.sr = 'app';

  var fmem = sload('f', {});      // liste ekranlarında son odak
  var RM = sload('rm', {});       // okuyucu/arama: sayfa başına odak + kaydırma
  var RC = sload('rc', {});       // okuyucu önbelleği: url -> {t, c, at}
  var SC = sload('sc', {});       // arama önbelleği: sorgu -> {r, at}

  /* ---------- Adres mi, arama mı? ---------- */
  var TR = { 'ı': 'i', 'İ': 'i', 'ş': 's', 'Ş': 's', 'ğ': 'g', 'Ğ': 'g',
             'ç': 'c', 'Ç': 'c', 'ö': 'o', 'Ö': 'o', 'ü': 'u', 'Ü': 'u' };
  var HOST_RE = /^((?:[a-z0-9çğıöşüÇĞİÖŞÜ-]+\.)+[a-zçğıöşüÇĞİÖŞÜ]{2,})(:\d{1,5})?([\/?#].*)?$/i;

  function asciiHost(h) {
    return h.replace(/[ıİşŞğĞçÇöÖüÜ]/g, function (c) { return TR[c]; }).toLowerCase();
  }
  function hostOf(u) {
    try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; }
  }
  function parse(raw) {
    var s = String(raw || '').replace(/\s+/g, ' ').trim(), m, u;
    if (!s) return null;
    if (/^[a-z][a-z0-9+.\-]*:\/\//i.test(s)) {
      if (/^https?:\/\//i.test(s)) {
        try { u = new URL(s); return { n: hostOf(u.href), u: u.href }; } catch (e) {}
      }
    } else if (s.indexOf(' ') < 0 && (m = HOST_RE.exec(s))) {
      try {
        u = new URL('https://' + asciiHost(m[1]) + (m[2] || '') + (m[3] || ''));
        return { n: hostOf(u.href), u: u.href };
      } catch (e) {}
    }
    var e = ENG[prefs.eng] || ENG.yandex;
    return { n: 'Ara: ' + s, u: e.q + encodeURIComponent(s), q: s, e: e.n };
  }
  function pretty(u) {
    var s = u.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
    try { s = decodeURI(s); } catch (e) {}
    return s;
  }
  function color(u) {
    var h = hostOf(u), x = 0;
    for (var i = 0; i < h.length; i++) x = (x * 31 + h.charCodeAt(i)) | 0;
    return PAL[Math.abs(x) % PAL.length];
  }

  /* ---------- Markdown -> bloklar (uzak içerik yalnızca metin olarak basılır) ---------- */
  var ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', '#39': "'" };
  function ents(s) {
    return s.replace(/&(#x[0-9a-f]+|#\d+|[a-z]+|#39);/gi, function (m, e) {
      var k = e.toLowerCase();
      if (ENT[k] !== undefined) return ENT[k];
      if (k[0] === '#') {
        var n = k[1] === 'x' ? parseInt(k.slice(2), 16) : parseInt(k.slice(1), 10);
        if (n > 0 && n < 0x110000) { try { return String.fromCodePoint(n); } catch (x) {} }
      }
      return m;
    });
  }
  function plainTxt(s) {
    return ents(s.replace(/`([^`]*)`/g, '$1')
      .replace(/\*{4}/g, ' ')
      .replace(/\*\*|__/g, '')
      .replace(/(^|[\s(\[])[*_]([^*_\s](?:[^*_]*[^*_\s])?)[*_](?=[\s).,;:!?\]]|$)/g, '$1$2')
      .replace(/~~/g, ''));
  }
  function resolveUrl(u, base) {
    try {
      var x = new URL(u, base);
      if (!/^https?:$/.test(x.protocol)) return null;
      if (/(^|\.)duckduckgo\.com$/.test(x.hostname) && /^\/l\/?$/.test(x.pathname)) {
        var t = x.searchParams.get('uddg');
        return t ? resolveUrl(t) : null;
      }
      return x.href;
    } catch (e) { return null; }
  }
  // "[metin](adres "başlık")" — iç içe köşeli ve normal parantezlere dayanıklı.
  function matchLink(s, i) {
    var depth = 0, j = i;
    for (; j < s.length; j++) {
      var c = s[j];
      if (c === '\\') { j++; continue; }
      if (c === '[') depth++;
      else if (c === ']') { depth--; if (depth === 0) break; }
    }
    if (j >= s.length || s[j + 1] !== '(') return null;
    var k = j + 2, pd = 1, start = k;
    for (; k < s.length; k++) {
      if (s[k] === '(') pd++;
      else if (s[k] === ')') { pd--; if (pd === 0) break; }
    }
    if (k >= s.length) return null;
    var inner = s.slice(start, k).trim();
    var mm = /^(\S+?)(?:\s+(?:"[^"]*"|'[^']*'|\([^)]*\)))?$/.exec(inner);
    var url = mm ? mm[1] : inner.split(/\s+/)[0];
    if (url.charAt(0) === '<' && url.charAt(url.length - 1) === '>') url = url.slice(1, -1);
    return { text: s.slice(i + 1, j), url: url, end: k + 1 };
  }
  function stripHash(u) { return String(u || '').split('#')[0]; }
  function inlineParse(s, base, page) {
    var segs = [], links = [], buf = '', i = 0;
    function flush() { if (buf) { segs.push({ t: 'x', s: plainTxt(buf) }); buf = ''; } }
    while (i < s.length) {
      var c = s[i];
      if (c === '\\' && i + 1 < s.length && /[\\`*_{}\[\]()#+\-.!|>~]/.test(s[i + 1])) {
        flush(); segs.push({ t: 'x', s: s[i + 1] }); i += 2; continue;
      }
      if (c === '!' && s[i + 1] === '[') {
        var im = matchLink(s, i + 1);
        if (im) { i = im.end; continue; }
      }
      if (c === '[') {
        var m = matchLink(s, i);
        if (m) {
          var txt = inlineParse(m.text, base).segs.map(function (x) { return x.s; }).join('').replace(/\s+/g, ' ').trim();
          var u = resolveUrl(m.url, base);
          if (u && page && stripHash(u) === page) u = null;
          if (u && txt) { flush(); segs.push({ t: 'a', s: txt, u: u }); links.push({ s: txt, u: u }); }
          else if (txt) buf += txt;
          i = m.end; continue;
        }
      }
      buf += c; i++;
    }
    flush();
    return { segs: segs, links: links };
  }
  // Okuyucu servisi paragrafları satır kaydırmadan verir; her satır ayrı bir blok olur.
  var H_RE = /^(#{1,6})\s+(.*?)\s*#*\s*$/, LI_RE = /^([*+-]|\d{1,3}[.)])\s+(.*)$/;
  function mdBlocks(md, base) {
    var lines = String(md).replace(/\r/g, '').split('\n'), out = [], i = 0, m, hm;
    var page = base ? stripHash(base) : '';
    function add(kind, text, lv) {
      // Satır içine gömülü liste işaretleri ("a*   b") ayraç olur.
      text = text.replace(/(\S)\*\s{3,}(?=\S)/g, '$1 · ');
      var r = inlineParse(text, base, page);
      r.segs.forEach(function (x) { x.s = kind === 'code' ? x.s : x.s.replace(/\s+/g, ' '); });
      var plain = r.segs.map(function (x) { return x.s; }).join('').replace(/\s+/g, ' ').trim();
      if (!plain) return;
      out.push({ k: kind, lv: lv || 0, segs: r.segs, links: r.links, plain: plain });
    }
    while (i < lines.length && out.length < MAX_BLOCKS) {
      var t = lines[i].trim();
      if (/^```/.test(t)) {
        var code = []; i++;
        while (i < lines.length && !/^```/.test(lines[i].trim())) { code.push(lines[i]); i++; }
        i++;
        var ct = code.join('\n').replace(/\s+$/, '');
        if (ct.trim()) out.push({ k: 'code', lv: 0, segs: [{ t: 'x', s: ct }], links: [], plain: ct });
        continue;
      }
      if (!t) { i++; continue; }
      if ((m = H_RE.exec(t))) { add('h', m[2], m[1].length); i++; continue; }
      var nx = i + 1 < lines.length ? lines[i + 1].trim() : '';
      if (/^=+$/.test(nx) && !LI_RE.test(t)) { add('h', t, 1); i += 2; continue; }
      if (/^-{2,}$/.test(nx) && !LI_RE.test(t) && !/^\|/.test(t)) { add('h', t, 2); i += 2; continue; }
      if (/^([-*_])(\s*\1){2,}$/.test(t)) { i++; continue; }
      if ((m = LI_RE.exec(t))) {
        var body = m[2].replace(/^\[(?:↑|\^)\]\([^)]*\)\s*/, '');
        if ((hm = H_RE.exec(body))) add('h', hm[2], hm[1].length);
        else add('li', body);
        i++; continue;
      }
      if ((m = /^>\s?(.*)$/.exec(t))) {
        var qq = [m[1]]; i++;
        while (i < lines.length && (m = /^>\s?(.*)$/.exec(lines[i].trim()))) { qq.push(m[1]); i++; }
        add('q', qq.join(' ')); continue;
      }
      if (/^\|.*\|$/.test(t)) {
        if (!/^\|[\s:|-]+\|$/.test(t)) {
          add('tr', t.replace(/^\||\|$/g, '').split('|').map(function (x) { return x.trim(); }).filter(Boolean).join(' · '));
        }
        i++; continue;
      }
      add('p', t); i++;
    }
    return out;
  }
  function norm(s) { return s.toLowerCase().replace(/[\s ·•|›»\-–—:*#.,;!?()\[\]"'\/]+/g, ''); }

  /* ---------- DDG Lite sonuçlarını ayrıştır ---------- */
  var DDG_BASE = 'https://lite.duckduckgo.com/lite/';
  var DISP_RE = /^(https?:\/\/)?[^\s\/]+\.[^\s\/.]{2,}(\/\S*)?(\s+\d{4}-\d{2}-\d{2}T[\d:.]+)?$/i;
  function inlineText(t) {
    return inlineParse(t).segs.map(function (x) { return x.s; }).join('').replace(/\s+/g, ' ').trim();
  }
  function parseDDG(md) {
    var res = [], cur = null, seen = {};
    String(md).replace(/\r/g, '').split('\n').forEach(function (line) {
      var t = line.trim();
      var m = /^(\d+)\.\s*(?=\[)/.exec(t);
      if (m) {
        var lk = matchLink(t, m[0].length);
        var u = lk ? resolveUrl(lk.url, DDG_BASE) : null;
        if (u && !/(^|\.)duckduckgo\.com$/.test(hostOf(u)) && !seen[u]) {
          seen[u] = 1;
          cur = { n: inlineText(lk.text) || hostOf(u), u: u, s: '' };
          res.push(cur);
        } else cur = null;
        return;
